<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Paper Trail Blog</title>
    <link rel="stylesheet" href="homePage.css">
</head>
<body>
	<header class="topbar">
		<div>
			<p class="eyebrow">Paper Trail Blog</p>
			<h1>Home Page</h1>
		</div>
		<a class="profile-avatar" href="/profile" aria-label="Open profile page">
			<img id="profile-avatar-image" src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><rect width="160" height="160" rx="80" fill="%23e8ecf7"/><circle cx="80" cy="66" r="28" fill="%23ffffff"/><path d="M34 136c8-25 28-38 46-38s38 13 46 38" fill="%23ffffff"/></svg>' alt="Profile picture">
		</a>
	</header>

	<main class="page-shell">
		<section class="card posts-card">
			<div class="card-head">
				<p class="section-label">Recent posts</p>
				<a href="/blog">Open blog</a>
			</div>
			<div id="home-posts-list" class="post-list"></div>
			<p id="home-empty-state" class="empty-state" hidden>No posts yet. Create one in the blog page.</p>
		</section>
	</main>
	<script src="homePage.js" defer></script>
</body>
</html>
